[project]
name = "clawshield"
version = "0.1.0"
description = "Measures, tunes and gates Cisco DefenseClaw's guardrail from observe to action mode."
readme = "README.md"
authors = [
    { email = "natrajexplore@gmail.com" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "typer>=0.12",
]

[project.scripts]
clawshield = "clawshield.cli:app"

[dependency-groups]
dev = [
    "bandit>=1.7",
    "mypy>=1.10",
    "pip-audit>=2.7",
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.5",
    "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "BLE", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105"]  # asserts; deliberately fake secrets in tests

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "clawshield.core.*"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
